# 景气 α 趋势跟随系统 —— 全部阈值集中在这里。
# 数值来源见 docs/03-融合投资框架.md；改动阈值即改动策略，请同时记录原因。

data:
  provider: hithink            # hithink（同花顺，需 Key）| free（腾讯/新浪/东财，零鉴权备用）
  keep_trading_days: 600       # 本地保留的日线窗口（MA200 + 250 日新高 + 信号追踪）
  cache_dir: .cache/jingshui
  output_dir: site/data
  request_interval: 0.12       # 同花顺请求最小间隔（秒）
  max_workers: 4               # 同花顺单标的端点（财报）并发数
  fin_cache_days: 5            # 财报缓存有效期（天）
  fin_cache_days_season: 1     # 披露旺季（4/8/10 月）财报缓存有效期
  constituents_cache_days: 7   # 板块成分股缓存有效期

market:                        # L0 大盘闸门 M
  indices:
    - {code: 000300.SH, name: 沪深300}
    - {code: 399006.SZ, name: 创业板指}
    - {code: 000001.SH, name: 上证指数}
  dd_drop_pct: -0.2            # 派发日：收跌 ≥0.2%（涨跌幅 ≤ -0.2%）且量 > 前一日
  dd_window: 25                # 统计窗口（交易日）
  offense_max_dd: 2            # OFFENSE：多头排列 且 派发日 ≤ 2
  defense_min_dd: 5            # DEFENSE：跌破 MA50 且 派发日 ≥ 5，或 MA50 < MA200
  position_cap: {OFFENSE: 1.0, CAUTION: 0.5, DEFENSE: 0.2}

sectors:                       # L1 行业景气度
  tag: industry
  code_prefix: "881"           # 同花顺二级行业（约 90 个）；884 为三级行业
  top_n: 5
  rs_days: 120                 # 板块 RS：近 120 日涨幅百分位，权重 40
  mom_days: 60                 # 中期动能：近 60 日涨幅百分位，权重 20
  high_days: 250               # 创新高：距 250 日最高价，权重 30
  high_full_dist: 0.02         # ≤2% 记满分
  high_zero_dist: 0.20         # ≥20% 记 0 分，中间线性
  require_near_high: 0.05      # 必要条件：板块指数距 250 日高点 ≤5% 才能进主线（null 关闭）
  weights: {rs: 40, high: 30, mom: 20, trend: 10}

stocks:                        # L2 个股六因子
  min_bars: 250                # 次新股排除
  min_avg_turnover: 5.0e+7     # 近 20 日日均成交额 ≥ 5000 万
  max_dist_high: 0.30          # 距 250 日高点 >30% 排除
  rs_days: 250                 # L：250 日涨幅全市场百分位
  rs_method: simple            # simple（按框架原文）| ibd（近一季双倍权重）
  pass_score: 70
  required_nonzero: [C, A, N, L]
  research_top_n: 60           # 非主线"全市场领军"研究池上限（按 RS 排序）
  research_min_rs: 90
  C: {weight: 20, profit_start: 0.25, profit_full: 0.50, revenue_min: 0.25}
  A: {weight: 15, growth_min: 0.25, years: 3, roe_start: 0.17, roe_full: 0.25}
  N: {weight: 20, full_dist: 0.05, half_dist: 0.10}
  S: {weight: 10, vol_ratio: 1.4, lookback: 5, small_cap_yi: 300}
  L: {weight: 20, rs_start: 80, rs_full: 90, sector_top_pct: 0.20}
  I: {weight: 10, lhb_days: 60}

buy:                           # L3 买点
  stage_high_days: 120         # 阶段高点回看窗口
  pullback_min: 0.08           # 回撤幅度 8%~25%
  pullback_max: 0.25
  pullback_out: 0.30           # 回撤 >30% 出局
  ma50_break_tol: 0.03         # 收盘低于 MA50 超过 3% 视为有效跌破
  restart_vol_ratio: 1.4       # 放量上攻：量 ≥ 1.4 × MA20 量
  platform_days: 10            # 回调平台高点回看天数
  chase_limit: 0.05            # 超过买点 5% 不追
  stop_loss: [0.07, 0.08]
  stop_loss_defense: 0.03
  batches: [0.40, 0.35, 0.25]

portfolio:                     # 仓位约束（静水 + 欧奈尔取严）
  max_single: 0.25
  max_sector: 0.40
  holdings: [4, 6]

sell:                          # 卖出触发（持仓体检）
  growth_drop_ratio: 0.333     # 单季增速连续两季回落 ≥1/3
  ma50_break_days: 5           # 放量跌破 50 日线且 5 日内未收回
  rs_from: 80
  rs_to: 60
  hold_8w_gain: 0.20           # 3 周内涨 ≥20% → 锁定持有 8 周
